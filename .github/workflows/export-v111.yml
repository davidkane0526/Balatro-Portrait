name: Temporary export v1.0.11 source

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        shell: bash
        run: |
          set -euo pipefail
          zip -q -r -9 /tmp/Balatro-Portrait-v1.0.11-source.zip . \
            -x '.git/*' '.github/workflows/export-v111.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: portrait-v111-source
          path: /tmp/Balatro-Portrait-v1.0.11-source.zip
          retention-days: 1
